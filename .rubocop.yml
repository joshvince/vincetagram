AllCops:
  NewCops: enable
  Exclude:
    # Vendored verbatim from joshvince.site/lib/errors_reporter.rb — lint it there.
    - 'lib/errors_reporter.rb'
    - 'db/**/*'
    - 'config/**/*'
    - 'script/**/*'
    - 'bin/**/*'
    - !ruby/regexp /old_and_unused\.rb$/

Style/Documentation:
  Enabled: false


Metrics/BlockLength:
  Exclude:
    - spec/**/*
